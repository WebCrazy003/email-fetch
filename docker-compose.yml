services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: email_fetch
      POSTGRES_USER: email_fetch
      POSTGRES_PASSWORD: email_fetch
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_fetch -d email_fetch"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run start -w @email-fetch/api
    environment:
      DATABASE_URL: postgres://email_fetch:email_fetch@postgres:5432/email_fetch
      REDIS_URL: redis://redis:6379
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://127.0.0.1:3000/api/email-providers/gmail/oauth/callback}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${GMAIL_TOKEN_ENCRYPTION_KEY:-}
      GMAIL_TEST_RECIPIENTS: ${GMAIL_TEST_RECIPIENTS:-}
      GMAIL_TEST_RECIPIENT: ${GMAIL_TEST_RECIPIENT:-}
      GMAIL_DEFAULT_SENDER_NAME: ${GMAIL_DEFAULT_SENDER_NAME:-Richard Wang}
      EMAIL_OPT_OUT_TEXT: ${EMAIL_OPT_OUT_TEXT:-To opt out of future emails, reply with "unsubscribe".}
      EMAIL_SEND_DAILY_LIMIT: ${EMAIL_SEND_DAILY_LIMIT:-100}
      EMAIL_SEND_HOURLY_LIMIT: ${EMAIL_SEND_HOURLY_LIMIT:-20}
      EMAIL_SEND_DELAY_SECONDS: ${EMAIL_SEND_DELAY_SECONDS:-5}
      API_PORT: 3000
      API_HOST: 0.0.0.0
      WEB_ORIGIN: http://127.0.0.1:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run worker -w @email-fetch/api
    environment:
      DATABASE_URL: postgres://email_fetch:email_fetch@postgres:5432/email_fetch
      REDIS_URL: redis://redis:6379
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://127.0.0.1:3000/api/email-providers/gmail/oauth/callback}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${GMAIL_TOKEN_ENCRYPTION_KEY:-}
      GMAIL_TEST_RECIPIENTS: ${GMAIL_TEST_RECIPIENTS:-}
      GMAIL_TEST_RECIPIENT: ${GMAIL_TEST_RECIPIENT:-}
      GMAIL_DEFAULT_SENDER_NAME: ${GMAIL_DEFAULT_SENDER_NAME:-Richard Wang}
      EMAIL_OPT_OUT_TEXT: ${EMAIL_OPT_OUT_TEXT:-To opt out of future emails, reply with "unsubscribe".}
      EMAIL_SEND_DAILY_LIMIT: ${EMAIL_SEND_DAILY_LIMIT:-100}
      EMAIL_SEND_HOURLY_LIMIT: ${EMAIL_SEND_HOURLY_LIMIT:-20}
      EMAIL_SEND_DELAY_SECONDS: ${EMAIL_SEND_DELAY_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_ORIGIN: http://127.0.0.1:3000
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
