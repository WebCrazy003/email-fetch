services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: email_fetch
      POSTGRES_USER: email_fetch
      POSTGRES_PASSWORD: email_fetch
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_fetch -d email_fetch"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run start -w @email-fetch/api
    environment:
      DATABASE_URL: postgres://email_fetch:email_fetch@postgres:5432/email_fetch
      REDIS_URL: redis://redis:6379
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      API_PORT: 3000
      API_HOST: 0.0.0.0
      WEB_ORIGIN: http://127.0.0.1:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run worker -w @email-fetch/api
    environment:
      DATABASE_URL: postgres://email_fetch:email_fetch@postgres:5432/email_fetch
      REDIS_URL: redis://redis:6379
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_ORIGIN: http://127.0.0.1:3000
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
